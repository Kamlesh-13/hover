<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Kamlesh Portfolio</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      font-family:Arial, sans-serif;
      color:white;
    }

    .hero{
      width:100%;
      min-height:100vh;
      background:
      linear-gradient(rgba(0,0,0,0.65),
      rgba(0,0,0,0.65)),
      url('https://images.unsplash.com/photo-1498050108023-c5249f4df085?q=80&w=1600&auto=format&fit=crop');
      background-size:cover;
      background-position:center;
      display:flex;
      flex-direction:column;
    }

    nav{
      width:100%;
      display:flex;
      justify-content:center;
      align-items:center;
      gap:35px;
      padding:22px 20px;
    }

    nav a{
      color:white;
      text-decoration:none;
      font-size:14px;
      font-weight:bold;
      transition:0.3s;
    }

    nav a:hover{
      color:#f39c12;
    }

    .hero-content{
      flex:1;
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
      text-align:center;
      padding:20px;
    }

    .hero-content h1{
      font-size:70px;
      margin-bottom:10px;
    }

    .hero-content h2{
      font-size:40px;
      color:#f39c12;
      margin-bottom:15px;
    }

    .hero-content p{
      font-size:22px;
      margin-bottom:35px;
      color:#ddd;
    }

    /* buttons */

    .buttons{
      display:flex;
      gap:20px;
      flex-wrap:wrap;
      justify-content:center;
    }

    .buttons button{
      padding:14px 30px;
      border:none;
      border-radius:6px;
      background:#f39c12;
      color:white;
      font-size:15px;
      font-weight:bold;
      cursor:pointer;
      transition:0.3s;
    }

    .buttons button:hover{
      background:#d35400;
      transform:translateY(-3px);
    }



  </style>
</head>

<body>

  <!-- HERO SECTION -->

  <section class="hero">

    <!-- NAVBAR -->

    <nav>
      <a href="#">HOME</a>
      <a href="#">PROFILE</a>
      <a href="#">SKILLS</a>
      <a href="#">PORTFOLIO</a>
      <a href="#">CONTACT</a>
    </nav>

    <!-- CONTENT -->

    <div class="hero-content">

      <h1>Hello..!</h1>

      <h2>I'm Kamlesh</h2>

      <p>Web Designer & Frontend Developer</p>

      <div class="buttons">
        <button>Download CV</button>
        <button>Hire Me</button>
      </div>

    </div>

  </section>

</body>
</html>
