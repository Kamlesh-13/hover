<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Box Model</title>
<style>
  body {
    background: #111;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
  }

  .box {
    display: flex;
    justify-content: center;
    align-items: center;
    border: 2px solid #ccc;
  }

  .outer {
    width: 500px;
    height: 300px;
    margin: 20px;
  }

  .middle1 {
    width: 400px;
    height: 220px;
    margin: 20px;
  }

  .middle2 {
    width: 300px;
    height: 150px;
    margin: 20px;
  }

  .inner {
    width: 100px;
    height: 60px;
    margin: 20px;
  }
</style>
</head>
<body>

<div class="box outer">
  <div class="box middle1">
    <div class="box middle2">
      <div class="box inner"></div>
    </div>
  </div>
</div>

</body>
</html>
